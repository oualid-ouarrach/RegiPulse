name: RTL checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rtl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rtl:
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 15
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git g++ make perl python3 libreadline8t64
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned simulators
        run: |
          ./scripts/install_simulators.sh
          echo "$PWD/.toolchain/bin" >> "$GITHUB_PATH"
      - name: Lint and run RTL simulation
        run: make check
      - name: Run independent simulator
        run: make test-iverilog
